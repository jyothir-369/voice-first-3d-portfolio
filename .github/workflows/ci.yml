name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Production build
        run: npm run build

      - name: Production bundle budget
        run: node scripts/check-bundle-size.mjs

      - name: E2E tests
        run: npx playwright test --project=chromium --grep-invert "acceptable bundle size"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

  secrets-check:
    name: Check for Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets in files
        run: |
          # Match an actual key assignment. The previous broad pattern also
          # matched this scanner's own regex and caused every CI run to fail.
          if git grep -nEI -- 'GROQ_API_KEY[[:space:]]*=[[:space:]]*["'"'"']?gsk_[A-Za-z0-9_-]+'; then
            echo "Error: Found a Groq API key in tracked source"
            exit 1
          fi

          # Check for .env file committed
          if [ -f ".env" ]; then
            echo "Error: .env file should not be committed"
            exit 1
          fi

          echo "No secrets found ✓"
